<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>BLK Majesty Videoanzeigen DE</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap">
<style>
  :root { --navy:#1c3b4b; --sky:#d2e6f2; --cream:#f6f1e8; --gold:#b07a3c; --red:#c8102e; --ok:#16a34a; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; background: #000; }
  body { font-family: Inter, Arial, sans-serif; color: var(--navy); }
  #stage { position: relative; width: 1080px; height: 1350px; overflow: hidden; background: #fff; }
  .abs { position: absolute; }
  .fill { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .h { font-family: Poppins, Arial, sans-serif; font-weight: 800; letter-spacing: -0.04em; line-height: 1.03; }
  .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,25,35,.78) 0%, rgba(10,25,35,0) 40%, rgba(10,25,35,0) 60%, rgba(10,25,35,.85) 100%); }
  .chip { display: inline-flex; align-items: center; gap: 14px; background: #fff; border-radius: 22px; padding: 20px 26px; font-weight: 700; font-size: 32px; box-shadow: 0 12px 34px rgba(0,0,0,.16); line-height: 1.15; }
  .tick { width: 44px; height: 44px; border-radius: 50%; background: var(--ok); display: grid; place-items: center; flex: none; }
  .tick svg { width: 24px; height: 24px; }
  .cta { display: inline-flex; align-items: center; background: var(--navy); color: #fff; border-radius: 99px; padding: 28px 54px; font-family: Poppins, sans-serif; font-weight: 700; font-size: 40px; letter-spacing: -0.02em; }
  .cta.light { background: #fff; color: var(--navy); }
  #bt { width: 250px; height: 250px; }
  .burst { position: absolute; width: 250px; height: 250px; display: grid; place-items: center; text-align: center; color: #fff; font-family: Poppins, sans-serif; }
  .burst svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .burst div { position: relative; font-weight: 800; line-height: 1; }
  .burst small { display: block; font-size: 22px; }
  .burst strong { display: block; font-size: 68px; letter-spacing: -0.04em; }
  .logo { display: flex; align-items: center; gap: 16px; font-family: Poppins, sans-serif; }
  .logo svg { width: 80px; height: auto; }
  .logo b { display: block; font-size: 42px; font-weight: 800; letter-spacing: .08em; line-height: .9; }
  .logo span { display: block; font-size: 19px; font-weight: 700; letter-spacing: .34em; }
  .price { font-family: Poppins, sans-serif; font-weight: 800; letter-spacing: -0.03em; }
  .price s { color: var(--red); font-weight: 600; font-size: .6em; margin-left: 14px; }
  /* end card */
  #end { position: absolute; inset: 0; background: var(--navy); color: #fff; display: grid; place-items: center; text-align: center; }
  #end .in { display: grid; gap: 40px; justify-items: center; }
  #end .h { font-size: 92px; }
  #end p { font-size: 34px; opacity: .9; }
  #end .price s { color: #ff9a9a; }
  .card { position: absolute; background: #fff; border-radius: 30px; overflow: hidden; box-shadow: 0 16px 40px rgba(0,0,0,.18); }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .lab { position: absolute; left: 18px; bottom: 16px; background: #fff; border-radius: 99px; padding: 10px 22px; font-weight: 700; font-size: 30px; display: flex; gap: 10px; align-items: center; }
  .card .lab i { width: 26px; height: 26px; border-radius: 50%; display: block; }
  .row { position: absolute; left: 70px; right: 70px; display: grid; grid-template-columns: 1fr 170px 210px; align-items: center; font-size: 34px; font-weight: 600; padding: 22px 0; border-bottom: 2px solid #e2dccf; }
  .row .c { text-align: center; }
  .y, .n { display: inline-grid; place-items: center; width: 58px; height: 58px; border-radius: 50%; font-weight: 800; font-size: 32px; }
  .y { background: var(--ok); color: #fff; } .n { background: #e9d3d3; color: var(--red); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <symbol id="scal" viewBox="0 0 66 66"><path d="M33 2l5 4 6-2 3 5 6 1 1 6 5 3-2 6 4 5-4 5 2 6-5 3-1 6-6 1-3 5-6-2-5 4-5-4-6 2-3-5-6-1-1-6-5-3 2-6-4-5 4-5-2-6 5-3 1-6 6-1 3-5 6 2z"/></symbol>
  <symbol id="tk" viewBox="0 0 16 16"><path d="M3 8.5l3 3 7-7" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="hound" viewBox="170 20 680 840"><g fill="#b07a3c"><path d="M383 112C427 162 479 137 497 56C518 127 565 155 613 105L594 165C535 142 467 143 412 174Z"/><circle cx="379" cy="105" r="18"/><circle cx="498" cy="42" r="21"/><circle cx="624" cy="92" r="18"/></g><g fill="none" stroke="currentColor" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"><path d="M450 241C418 267 437 333 465 398C492 459 494 514 457 549C432 574 410 565 379 539C347 511 320 496 286 483C252 470 231 451 233 421C235 384 273 347 315 303L380 231C417 194 463 183 508 184C563 184 606 201 637 232C656 251 682 251 718 251L787 252C816 252 835 256 836 269C838 283 826 294 827 310C839 361 826 412 795 430C776 441 749 436 725 437C682 437 650 456 635 489C615 532 624 581 653 617C679 651 717 672 743 710C771 749 783 791 783 836H182C192 792 228 765 274 738L453 650C525 614 562 583 588 533C614 482 640 450 687 438"/><path d="M305 499C289 570 240 647 256 728"/></g><g fill="currentColor"><path d="M526 264C554 243 591 241 616 252L632 275C590 275 560 260 526 264Z"/><path d="M774 255L815 256Q837 257 835 271L826 301C799 300 781 286 774 270Z"/></g></symbol>
</defs></svg>
<div id="stage"></div>
<script>
const IMG = n => '../../img2/' + n + '.png';
const TK = '<span class="tick"><svg><use href="#tk"/></svg></span>';
const LOGO = (light) => `<div class="logo" style="color:${light ? '#fff' : 'var(--navy)'}"><svg style="color:${light ? '#fff' : 'var(--navy)'}"><use href="#hound"/></svg><div><b>BLK</b><span>MAJESTY</span></div></div>`;
const BURST = (top, big, bot, fill) => `<div class="burst" id="burst"><svg><use href="#scal" fill="${fill || '#000'}"/></svg><div style="color:${fill === '#fff' ? '#000' : '#fff'}"><small>${top}</small><strong>${big}</strong><small>${bot}</small></div></div>`;
const PRICE_DE = 'ab 150 €<s>300 €</s>';
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => { x = clamp(x); return 1 - Math.pow(1 - x, 3); };
const prog = (t, a, d) => ease((t - a) / d);
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
function show(el, p, dy = 60, dx = 0) { if (!el) return; el.style.opacity = p; el.style.transform = `translate(${dx * (1 - p)}px, ${dy * (1 - p)}px)` + (el.dataset.base || ''); }
function zoom(el, t, dur, from = 1.0, to = 1.12) { el.style.transform = `scale(${from + (to - from) * clamp(t / dur)})`; }

const END = (head, sub) => `<div id="end"><div class="in">${LOGO(true)}<div class="h">${head}</div><div class="price" style="font-size:76px">${PRICE_DE}</div><span class="cta light">Jetzt shoppen →</span><p>${sub || 'Kostenloser Express-Versand · 30 Tage Rückgabe'}</p></div></div>`;
function endCard(t, start) { const e = $('#end'); const p = prog(t, start, .5); e.style.opacity = p; e.style.transform = `scale(${1.06 - .06 * p})`; $$('#end .in > *').forEach((c, i) => show(c, prog(t, start + .2 + i * .12, .45), 40)); }

const V = {
  // 1. Hook
  1: { dur: 9, html: `
      <img class="fill" id="i1" src="${IMG('car-navy')}"><div class="shade"></div>
      <div class="abs" style="left:70px;right:70px;top:80px;color:#fff"><div class="h" id="t1" style="font-size:108px">Schluss mit dem Chaos auf der Rückbank.</div>
      <div id="t2" style="font-size:40px;margin-top:26px;font-weight:500">Ein eigener, sicherer Platz für jede Fahrt.</div></div>
      <div class="abs" id="bt" style="right:50px;top:620px">${BURST('BLACK FRIDAY', '50 %', 'RABATT')}</div>
      <div class="abs" id="lg" style="left:70px;bottom:80px">${LOGO(true)}</div>${END('Entspannte Fahrten starten hier.')}`,
    render(t) { zoom($('#i1'), t, 6.6); show($('#t1'), prog(t, .2, .7)); show($('#t2'), prog(t, .9, .6)); show($('#bt'), prog(t, 1.6, .5), 0, 120); show($('#lg'), prog(t, 2, .5), 30); endCard(t, 6.6); } },
  // 2. Features
  2: { dur: 10, html: `<div class="fill" style="background:#eceae6"></div>
      <div class="abs" style="top:80px;left:0;right:0;text-align:center"><div class="h" id="t1" style="font-size:90px">Für entspannte Autofahrten</div><div id="t2" style="font-size:36px;margin-top:16px;color:#4a5d68">Alles, was dein Hund braucht – in einem Sitz.</div></div>
      <div class="abs" style="left:190px;top:330px;width:700px;height:700px;border-radius:40px;overflow:hidden"><img class="fill" id="i1" src="${IMG('navy')}"></div>
      <div class="abs chip" id="c1" style="left:40px;top:360px;max-width:380px">${TK}Kopfstützen-Gurt hält alles fest</div>
      <div class="abs chip" id="c2" style="right:40px;top:440px;max-width:360px">${TK}Integrierte Sicherheitsleine</div>
      <div class="abs chip" id="c3" style="left:40px;top:820px;max-width:360px">${TK}Waschbares Fleece-Kissen</div>
      <div class="abs chip" id="c4" style="right:40px;top:900px;max-width:420px;font-size:29px">${TK}Reißverschlusstasche + Tragegurt</div>
      <div class="abs" id="lg" style="left:70px;bottom:80px">${LOGO(false)}</div>${END('Alles drin. Alles dran.')}`,
    render(t) { zoom($('#i1'), t, 7.5, 1.0, 1.08); show($('#t1'), prog(t, .1, .6)); show($('#t2'), prog(t, .5, .6)); ['#c1', '#c2', '#c3', '#c4'].forEach((s, i) => show($(s), prog(t, 1.4 + i * 1.1, .5), 0, i % 2 ? 160 : -160)); show($('#lg'), prog(t, 1, .5), 30); endCard(t, 7.6); } },
  // 3. Colours
  3: { dur: 9, html: `<div class="fill" style="background:var(--sky)"></div>
      <div class="abs" style="top:90px;left:0;right:0;text-align:center"><div class="h" id="t1" style="font-size:100px">Wähle ihre Farbe</div><div id="t2" style="font-size:38px;margin-top:16px">4 Farben · Medium &amp; Extra Large</div></div>
      ${[['navy', 'Navy', '#22305a', 70, 330], ['pink', 'Rosa', '#e7949f', 555, 330], ['lavender', 'Lavendel', '#b8b3d4', 70, 745], ['green', 'Olivgrün', '#5c6b35', 555, 745]].map((c, i) => `<div class="card" id="k${i}" style="left:${c[3]}px;top:${c[4]}px;width:455px;height:390px"><img src="${IMG(c[0])}"><span class="lab"><i style="background:${c[2]}"></i>${c[1]}</span></div>`).join('')}
      <div class="abs price" id="pr" style="left:70px;bottom:80px;font-size:70px">${PRICE_DE}</div>${END('Welche Farbe passt zu euch?')}`,
    render(t) { show($('#t1'), prog(t, .1, .6)); show($('#t2'), prog(t, .5, .6)); for (let i = 0; i < 4; i++) { const p = prog(t, 1 + i * .7, .55); const k = $('#k' + i); k.style.opacity = p; k.style.transform = `scale(${.8 + .2 * p})`; } show($('#pr'), prog(t, 4, .6)); endCard(t, 6.6); } },
  // 4. Car + home
  4: { dur: 9, html: `<img class="fill" id="i1" src="${IMG('car-green')}"><div class="abs" id="wipe" style="inset:0;overflow:hidden"><img class="fill" id="i2" src="${IMG('home-navy')}"></div>
      <div class="abs h" id="l1" style="left:60px;bottom:120px;background:var(--navy);color:#fff;font-size:68px;padding:18px 34px;border-radius:20px">Tagsüber Autositz</div>
      <div class="abs h" id="l2" style="left:60px;bottom:120px;background:#fff;color:var(--navy);font-size:68px;padding:18px 34px;border-radius:20px">Nachts Hundebett</div>
      <div class="abs h" id="m" style="right:60px;top:60px;width:200px;height:200px;border-radius:50%;background:var(--gold);color:#fff;display:grid;place-items:center;font-size:54px;border:8px solid #fff">2 in 1</div>
      <div class="abs" id="lg" style="left:60px;top:60px;background:#fff;padding:16px 24px;border-radius:20px">${LOGO(false)}</div>${END('Ein Kauf. Zwei Lieblingsplätze.')}`,
    render(t) { zoom($('#i1'), t, 3.5); const w = prog(t, 3.2, .8); $('#wipe').style.clipPath = `inset(0 0 0 ${100 - w * 100}%)`; zoom($('#i2'), t - 3.2, 3.5); show($('#l1'), prog(t, .5, .5) * (1 - prog(t, 3.1, .3)), 40); show($('#l2'), prog(t, 4, .5), 40); const m = prog(t, 5, .5); $('#m').style.opacity = m; $('#m').style.transform = `scale(${.5 + .5 * m}) rotate(${-20 + 20 * m}deg)`; show($('#lg'), prog(t, .2, .5), -30); endCard(t, 6.6); } },
  // 5. Black Friday
  5: { dur: 8, html: `<div class="fill" style="background:#000"></div><div class="abs" style="left:0;right:0;top:0;height:840px;overflow:hidden"><img class="fill" id="i1" src="${IMG('car-pink')}"></div>
      <div class="abs" id="bt" style="right:50px;top:50px">${BURST('BIS ZU', '50 %', 'RABATT')}</div>
      <div class="abs" style="left:70px;right:70px;top:890px;color:#fff"><div class="h" id="t1" style="font-size:96px">BLACK FRIDAY</div>
      <div id="t2" style="font-size:42px;margin-top:18px;font-weight:600">Nur bis Samstag, 28. November</div>
      <div class="price" id="pr" style="font-size:72px;margin-top:40px">${PRICE_DE.replace('<s>', '<s style="color:#ff9a9a">')}</div></div>${END('Sichere dir 50 % Rabatt.', 'Solange der Vorrat reicht')}`,
    render(t) { zoom($('#i1'), t, 6); const b = prog(t, .3, .5); $('#bt').style.opacity = b; $('#bt').style.transform = `scale(${.4 + .6 * b + .04 * Math.sin(t * 6) * b})`; show($('#t1'), prog(t, .6, .5)); show($('#t2'), prog(t, 1.1, .5)); show($('#pr'), prog(t, 1.7, .5)); endCard(t, 5.6); } },
  // 6. Comparison
  6: { dur: 10, html: `<div class="fill" style="background:var(--cream)"></div>
      <div class="abs h" id="t1" style="left:70px;top:80px;font-size:84px">Lose auf dem Sitz<br>vs. Dog Dock</div>
      <div class="row" style="top:340px;border:0;font-family:Poppins,sans-serif;font-size:30px"><span></span><span class="c">Lose</span><span class="c" style="background:var(--navy);color:#fff;border-radius:24px 24px 0 0;padding:14px 0">Dog Dock</span></div>
      ${['Bleibt an Ort und Stelle', 'Kein Sprung nach vorne', 'Keine Haare auf dem Sitz', 'Weiches, waschbares Kissen', 'Auch zu Hause ein Bett'].map((x, i) => `<div class="row" id="r${i}" style="top:${420 + i * 104}px"><span>${x}</span><span class="c"><span class="n">✕</span></span><span class="c" style="background:#fff;padding:22px 0;margin:-22px 0"><span class="y">✓</span></span></div>`).join('')}
      <div class="card" id="pi" style="right:70px;bottom:70px;width:330px;height:330px"><img src="${IMG('lavender')}"></div>
      <div class="abs" id="lg" style="left:70px;bottom:120px">${LOGO(false)}</div>${END('Die bessere Wahl für jede Fahrt.')}`,
    render(t) { show($('#t1'), prog(t, .1, .6)); for (let i = 0; i < 5; i++) show($('#r' + i), prog(t, 1 + i * .8, .45), 0, -80); show($('#pi'), prog(t, 4.6, .5), 60); show($('#lg'), prog(t, 4.8, .5), 30); endCard(t, 7.6); } },
};
const v = V[+(new URLSearchParams(location.search).get('v') || 1)];
$('#stage').innerHTML = v.html;
// Optional time stretch so a voiceover fits: ?k=<factor>&d=<seconds>
const Q = new URLSearchParams(location.search), K = +(Q.get('k') || 1);
window.DUR = +(Q.get('d') || v.dur * K);
window.renderAt = t => v.render(t / K);
v.render(0);
</script>
</body>
</html>
